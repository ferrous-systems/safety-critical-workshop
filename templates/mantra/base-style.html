{#
  Design tokens and component styles for the mantra HTML report.

  `base()` is the entry point; base-layout.html imports it. Overriding this
  file alone restyles the pages that still use mantra's default templates.
#}
{% macro base() %}
<style>
  :root {
    color-scheme: light;

    --bg: #f6f7f9;
    --bg-elev: #ffffff;
    --bg-sunken: #eceef2;
    --bg-hover: #f0f2f6;
    --border: #d8dce4;
    --border-strong: #b9c0cc;
    --text: #14181f;
    --text-dim: #5b6577;
    --text-faint: #8b94a5;
    --accent: #1d4ed8;
    --accent-bg: #e5edff;
    --accent-fg: #ffffff;
    --shadow: 0 1px 2px rgba(16, 22, 34, 0.06), 0 4px 12px rgba(16, 22, 34, 0.05);
    --shadow-sm: 0 1px 2px rgba(16, 22, 34, 0.08);

    --ok: #15803d;
    --ok-bg: #dcfce7;
    --warn: #a16207;
    --warn-bg: #fef3c7;
    --bad: #b91c1c;
    --bad-bg: #fee2e2;
    --info: #0e7490;
    --info-bg: #cffafe;
    --muted: #52596b;
    --muted-bg: #e7e9ee;
    --special: #6d28d9;
    --special-bg: #ede9fe;

    --radius: 8px;
    --radius-sm: 5px;
    --nav-width: 288px;
    --topbar-height: 56px;

    --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
      "Helvetica Neue", Arial, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
      "Liberation Mono", monospace;
  }

  :root[data-theme="dark"] {
    color-scheme: dark;

    --bg: #0f1319;
    --bg-elev: #161b23;
    --bg-sunken: #1c222c;
    --bg-hover: #1e2530;
    --border: #2a323f;
    --border-strong: #3d4757;
    --text: #e6e9ef;
    --text-dim: #a2acbd;
    --text-faint: #6f7a8c;
    --accent: #6ea8ff;
    --accent-bg: #16233d;
    --accent-fg: #0f1319;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 4px 14px rgba(0, 0, 0, 0.3);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);

    --ok: #6ee7a5;
    --ok-bg: #113325;
    --warn: #fbbf5c;
    --warn-bg: #3a2c0d;
    --bad: #fca5a5;
    --bad-bg: #3d1717;
    --info: #67e8f9;
    --info-bg: #0c333b;
    --muted: #9aa4b5;
    --muted-bg: #232a35;
    --special: #c4b5fd;
    --special-bg: #2a2145;
  }

  *,
  *::before,
  *::after {
    box-sizing: border-box;
  }

  html {
    -webkit-text-size-adjust: 100%;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  a {
    color: var(--accent);
    text-decoration: none;
  }

  a:hover {
    text-decoration: underline;
  }

  code,
  kbd,
  pre,
  samp,
  .mono {
    font-family: var(--font-mono);
    font-size: 0.9em;
  }

  code {
    background: var(--bg-sunken);
    border-radius: 4px;
    padding: 0.1em 0.36em;
  }

  pre {
    background: var(--bg-sunken);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 0.9rem 1rem;
    overflow-x: auto;
  }

  pre code {
    background: none;
    padding: 0;
  }

  kbd {
    background: var(--bg-sunken);
    border: 1px solid var(--border);
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 0.05em 0.4em;
    font-size: 0.8em;
    color: var(--text-dim);
  }

  h1,
  h2,
  h3,
  h4 {
    line-height: 1.25;
    font-weight: 620;
    letter-spacing: -0.01em;
    margin: 0 0 0.75rem;
  }

  h1 {
    font-size: 1.6rem;
  }
  h2 {
    font-size: 1.15rem;
    margin-top: 2.25rem;
    padding-bottom: 0.4rem;
    border-bottom: 1px solid var(--border);
  }
  h3 {
    font-size: 1rem;
    margin-top: 1.5rem;
  }
  h4 {
    font-size: 0.9rem;
    margin-top: 1.2rem;
    color: var(--text-dim);
  }

  p {
    margin: 0 0 1rem;
  }

  hr {
    border: 0;
    border-top: 1px solid var(--border);
    margin: 2rem 0;
  }

  /* ---- layout ------------------------------------------------------- */

  .topbar {
    position: sticky;
    top: 0;
    z-index: 30;
    height: var(--topbar-height);
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0 1.25rem;
    background: var(--bg-elev);
    border-bottom: 1px solid var(--border);
  }

  .topbar__brand {
    display: flex;
    align-items: baseline;
    gap: 0.55rem;
    font-weight: 640;
    color: var(--text);
    white-space: nowrap;
  }

  .topbar__brand:hover {
    text-decoration: none;
  }

  .topbar__mark {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    padding: 0.1rem 0.4rem;
  }

  .topbar__sub {
    font-weight: 400;
    font-size: 0.85rem;
    color: var(--text-dim);
  }

  .topbar__spacer {
    flex: 1;
  }

  .shell {
    display: flex;
    align-items: flex-start;
  }

  .sidebar {
    position: sticky;
    top: var(--topbar-height);
    flex: 0 0 var(--nav-width);
    width: var(--nav-width);
    height: calc(100vh - var(--topbar-height));
    overflow-y: auto;
    padding: 1.1rem 0.9rem 3rem;
    background: var(--bg-elev);
    border-right: 1px solid var(--border);
  }

  .content {
    flex: 1 1 auto;
    min-width: 0;
    padding: 2rem 2.25rem 5rem;
    max-width: 1180px;
  }

  @media (max-width: 900px) {
    .sidebar {
      display: none;
    }
    .content {
      padding: 1.25rem 1rem 3rem;
    }
  }

  /* ---- navigation --------------------------------------------------- */

  .nav-group {
    margin-bottom: 1.25rem;
  }

  .nav-title {
    font-size: 0.7rem;
    font-weight: 650;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-faint);
    padding: 0 0.55rem;
    margin-bottom: 0.4rem;
  }

  .nav-link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    padding: 0.34rem 0.55rem;
    border-radius: var(--radius-sm);
    color: var(--text-dim);
    font-size: 0.875rem;
  }

  .nav-link:hover {
    background: var(--bg-hover);
    color: var(--text);
    text-decoration: none;
  }

  .nav-link--nested {
    padding-left: 1.4rem;
    font-family: var(--font-mono);
    font-size: 0.8rem;
  }

  .nav-count {
    font-size: 0.72rem;
    color: var(--text-faint);
    font-variant-numeric: tabular-nums;
  }

  /* ---- controls ----------------------------------------------------- */

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    height: 32px;
    padding: 0 0.7rem;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--bg-elev);
    color: var(--text-dim);
    font: inherit;
    font-size: 0.82rem;
    cursor: pointer;
    white-space: nowrap;
  }

  .btn:hover {
    background: var(--bg-hover);
    color: var(--text);
    border-color: var(--border-strong);
  }

  .search {
    position: relative;
    flex: 1 1 320px;
    max-width: 420px;
  }

  .search input {
    width: 100%;
    height: 32px;
    padding: 0 2.1rem 0 0.7rem;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--bg);
    color: var(--text);
    font: inherit;
    font-size: 0.85rem;
  }

  .search input:focus {
    outline: 2px solid var(--accent);
    outline-offset: -1px;
    border-color: transparent;
  }

  .search kbd {
    position: absolute;
    right: 0.4rem;
    top: 50%;
    transform: translateY(-50%);
    pointer-events: none;
  }

  .search input:focus + kbd {
    display: none;
  }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.5rem;
    margin: 1rem 0 0.75rem;
    padding: 0.75rem;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    height: 26px;
    padding: 0 0.6rem;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--bg);
    color: var(--text-dim);
    font: inherit;
    font-size: 0.78rem;
    cursor: pointer;
    user-select: none;
  }

  .chip:hover {
    border-color: var(--border-strong);
    color: var(--text);
  }

  .chip[aria-pressed="true"] {
    background: var(--accent-bg);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 560;
  }

  .chip__count {
    font-variant-numeric: tabular-nums;
    font-size: 0.72rem;
    color: var(--text-faint);
  }

  .chip[aria-pressed="true"] .chip__count {
    color: inherit;
  }

  .result-count {
    margin-left: auto;
    font-size: 0.8rem;
    color: var(--text-faint);
    font-variant-numeric: tabular-nums;
  }

  /* ---- cards and metrics -------------------------------------------- */

  .card {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.1rem 1.25rem;
    box-shadow: var(--shadow-sm);
  }

  .grid {
    display: grid;
    gap: 1rem;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  }

  .hero {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 2rem;
    margin-bottom: 1.5rem;
  }

  .gauge {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .gauge svg {
    transform: rotate(-90deg);
  }

  .gauge__track {
    fill: none;
    stroke: var(--bg-sunken);
    stroke-width: 12;
  }

  .gauge__value {
    fill: none;
    stroke: var(--accent);
    stroke-width: 12;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.6s ease;
  }

  .gauge__label {
    display: flex;
    flex-direction: column;
  }

  .gauge__pct {
    font-size: 1.9rem;
    font-weight: 660;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
  }

  .gauge__caption {
    font-size: 0.82rem;
    color: var(--text-dim);
  }

  .metric__label {
    font-size: 0.72rem;
    font-weight: 620;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-faint);
  }

  .metric__value {
    font-size: 1.75rem;
    font-weight: 640;
    line-height: 1.2;
    font-variant-numeric: tabular-nums;
    margin-top: 0.15rem;
  }

  .metric__note {
    font-size: 0.8rem;
    color: var(--text-dim);
  }

  .bar {
    display: flex;
    height: 10px;
    border-radius: 999px;
    overflow: hidden;
    background: var(--bg-sunken);
    margin: 0.9rem 0 0.6rem;
  }

  .bar__seg {
    height: 100%;
  }

  .bar__seg--ok {
    background: var(--ok);
  }
  .bar__seg--warn {
    background: var(--warn);
  }
  .bar__seg--bad {
    background: var(--bad);
  }
  .bar__seg--info {
    background: var(--info);
  }
  .bar__seg--muted {
    background: var(--border-strong);
  }
  .bar__seg--special {
    background: var(--special);
  }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem 1rem;
    font-size: 0.8rem;
    color: var(--text-dim);
  }

  .legend span::before {
    content: "";
    display: inline-block;
    width: 9px;
    height: 9px;
    border-radius: 2px;
    margin-right: 0.4rem;
    background: currentColor;
  }

  .legend .l-ok {
    color: var(--ok);
  }
  .legend .l-warn {
    color: var(--warn);
  }
  .legend .l-bad {
    color: var(--bad);
  }
  .legend .l-info {
    color: var(--info);
  }
  .legend .l-muted {
    color: var(--border-strong);
  }
  .legend .l-special {
    color: var(--special);
  }

  .legend b {
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }

  /* ---- badges ------------------------------------------------------- */

  .badge {
    display: inline-flex;
    align-items: center;
    height: 20px;
    padding: 0 0.45rem;
    border-radius: 4px;
    font-size: 0.72rem;
    font-weight: 580;
    letter-spacing: 0.01em;
    white-space: nowrap;
    background: var(--muted-bg);
    color: var(--muted);
  }

  .state-badge {
    display: inline-flex;
    align-items: center;
    height: 20px;
    padding: 0 0.45rem;
    margin-left: 0.4rem;
    border-radius: 4px;
    font-size: 0.72rem;
    font-weight: 580;
    background: var(--muted-bg);
    color: var(--muted);
  }

  .optional-badge {
    display: inline-flex;
    align-items: center;
    height: 20px;
    padding: 0 0.45rem;
    margin-left: 0.4rem;
    border-radius: 4px;
    font-size: 0.72rem;
    font-weight: 580;
    background: var(--info-bg);
    color: var(--info);
  }

  .state-verified,
  .state-passed,
  .state-valid,
  .badge--ok {
    background: var(--ok-bg);
    color: var(--ok);
  }

  .state-failed,
  .badge--bad {
    background: var(--bad-bg);
    color: var(--bad);
  }

  .state-skipped,
  .state-unknown,
  .badge--warn {
    background: var(--warn-bg);
    color: var(--warn);
  }

  .state-unverified,
  .state-excluded,
  .badge--muted {
    background: var(--muted-bg);
    color: var(--muted);
  }

  .state-deprecated,
  .state-obsolete,
  .badge--special {
    background: var(--special-bg);
    color: var(--special);
  }

  .badge--info {
    background: var(--info-bg);
    color: var(--info);
  }

  .badge--accent {
    background: var(--accent-bg);
    color: var(--accent);
  }

  /* ---- tables ------------------------------------------------------- */

  .table-wrap {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--bg-elev);
    overflow: auto;
    max-height: 78vh;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.86rem;
  }

  thead th {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--bg-sunken);
    text-align: left;
    font-size: 0.72rem;
    font-weight: 650;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-dim);
    padding: 0.6rem 0.75rem;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  th[data-sort] {
    cursor: pointer;
    user-select: none;
  }

  th[data-sort]:hover {
    color: var(--text);
  }

  th[data-sort]::after {
    content: "↕";
    opacity: 0.35;
    margin-left: 0.35rem;
    font-size: 0.8em;
  }

  th[data-sort][aria-sort="ascending"]::after {
    content: "↑";
    opacity: 1;
    color: var(--accent);
  }

  th[data-sort][aria-sort="descending"]::after {
    content: "↓";
    opacity: 1;
    color: var(--accent);
  }

  tbody td {
    padding: 0.55rem 0.75rem;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }

  tr[hidden] {
    display: none;
  }

  tbody tr:last-child td {
    border-bottom: 0;
  }

  tbody tr:hover td {
    background: var(--bg-hover);
  }

  td.num {
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  .req-id {
    font-family: var(--font-mono);
    font-size: 0.82rem;
    white-space: nowrap;
  }

  .req-id .dim {
    color: var(--text-faint);
  }

  .cell-list {
    display: flex;
    flex-wrap: wrap;
    gap: 0.25rem;
  }

  .cell-list a {
    font-family: var(--font-mono);
    font-size: 0.76rem;
    background: var(--bg-sunken);
    border-radius: 4px;
    padding: 0.05rem 0.35rem;
  }

  .empty {
    color: var(--text-faint);
  }

  .table-empty {
    display: none;
    padding: 2rem;
    text-align: center;
    color: var(--text-faint);
    font-size: 0.9rem;
  }

  /* ---- definition lists --------------------------------------------- */

  .meta {
    display: grid;
    grid-template-columns: max-content 1fr;
    gap: 0.45rem 1.25rem;
    margin: 0 0 1.25rem;
    font-size: 0.88rem;
  }

  .meta dt {
    color: var(--text-faint);
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding-top: 0.12rem;
  }

  .meta dd {
    margin: 0;
  }

  /* ---- prose (rendered requirement text) ---------------------------- */

  .prose {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: var(--radius);
    padding: 1.1rem 1.25rem 0.4rem;
  }

  .prose > :last-child {
    margin-bottom: 0.7rem;
  }

  .prose h1,
  .prose h2,
  .prose h3 {
    font-size: 0.95rem;
    margin-top: 1.2rem;
    border: 0;
    padding: 0;
  }

  .prose ul,
  .prose ol {
    margin: 0 0 1rem;
    padding-left: 1.3rem;
  }

  .prose li {
    margin-bottom: 0.3rem;
  }

  .prose blockquote {
    margin: 0 0 1rem;
    padding: 0.1rem 0 0.1rem 0.9rem;
    border-left: 3px solid var(--border-strong);
    color: var(--text-dim);
  }

  .prose table {
    font-size: 0.82rem;
    margin-bottom: 1rem;
    border: 1px solid var(--border);
  }

  .prose thead th {
    position: static;
  }

  .breadcrumb {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.3rem;
    font-family: var(--font-mono);
    font-size: 0.78rem;
    color: var(--text-faint);
    margin-bottom: 0.5rem;
  }

  .breadcrumb .sep {
    opacity: 0.5;
  }

  .page-title {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.6rem;
  }

  .subtitle {
    color: var(--text-dim);
    font-size: 0.9rem;
    margin: -0.35rem 0 1.5rem;
  }

  .note {
    background: var(--accent-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.7rem 0.9rem;
    font-size: 0.85rem;
    color: var(--text-dim);
    margin-bottom: 1.25rem;
  }

  .note strong {
    color: var(--text);
  }

  .stack {
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem;
  }

  .stack > a,
  .stack > span.pill {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    font-family: var(--font-mono);
    font-size: 0.78rem;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0.12rem 0.6rem;
  }
</style>
{% endmacro %}
