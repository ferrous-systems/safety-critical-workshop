[package]
name = "nrf-hal"
version = "0.1.0"
edition = "2021"

[dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
cortex-m-semihosting = "0.5.0"
defmt = "1"
defmt-rtt = "1.1"
embassy-time = "0.5"
embedded-hal = "1.0"
nb = "1"
hal = { package = "embassy-nrf", version = "0.11", features = ["nrf52840", "time-driver-rtc1", "unstable-pac"] }
